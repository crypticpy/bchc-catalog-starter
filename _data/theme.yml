# Theme: colors and typography.
# Colors are hex values exposed as CSS variables and consumed by Tailwind, so
# changing them re-themes the whole site on the next build. Keep text/background
# pairs at WCAG AA contrast (4.5:1 for body text). `line_strong` outlines
# interactive controls (keep it >= 3:1 on card) and `warn` is reserved for
# sensitive-data indicators and validation errors. The optional `motion` block
# sets the transition durations and easing (fast <= base <= slow, up to 1000ms);
# delete it and the built-in defaults apply.
# Regenerate this file with `npm run setup` or the /setup/ page on the deployed site.

colors:
  primary: "#1D4E89"
  primary_dark: "#12305A"
  secondary: "#0F6357"
  accent: "#E07A2F"
  ink: "#1B2430"
  muted: "#5A6573"
  line: "#D9E0E8"
  line_strong: "#7C8A9B"
  surface: "#F5F7FA"
  surface_tint: "#EAF0F7"
  card: "#FFFFFF"
  on_dark: "#F7F9FC"
  warn: "#B45309"
fonts:
  heading: Source Serif 4
  body: Inter
  google_fonts_url: ""
type:
  measure: 36rem
  measure_display: 44rem
radius: soft
motion:
  fast: 120ms
  base: 180ms
  slow: 240ms
  ease: "cubic-bezier(0.2, 0, 0, 1)"
